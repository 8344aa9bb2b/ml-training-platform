version: '3.8'

services:
  controller:
    build: .
    container_name: rmltp-controller
    command: ["python", "src/controller/main.py", "--host", "0.0.0.0", "--port", "8000", "--mode", "serve"]
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rmltp-net

  worker-1:
    build: .
    container_name: rmltp-worker-1
    command: ["python", "src/node/main.py", "--id", "worker-1", "--port", "8001", "--controller", "controller:8000"]
    depends_on:
      - controller
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rmltp-net

  worker-2:
    build: .
    container_name: rmltp-worker-2
    command: ["python", "src/node/main.py", "--id", "worker-2", "--port", "8002", "--controller", "controller:8000"]
    depends_on:
      - controller
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rmltp-net

  dashboard:
    build: .
    container_name: rmltp-dashboard
    command: ["python", "dashboard.py", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    depends_on:
      - controller
      - worker-1
      - worker-2
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    networks:
      - rmltp-net

networks:
  rmltp-net:
    driver: bridge
