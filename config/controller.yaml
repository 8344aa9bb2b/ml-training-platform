controller:
  host: 0.0.0.0
  port: 8000
  worker_update_interval: 1.0  # seconds
  max_workers: 100
  task_queue_size: 1000
  resource_monitor_interval: 5.0
  enable_leader_heartbeat: true
  heartbeat_interval: 10.0
  leader_timeout: 30.0
  checkpoint:
    enabled: true
    directory: ./logs/checkpoints
    interval_steps: 100
    max_checkpoints: 5

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ./logs/controller.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

monitoring:
  enabled: true
  prometheus_port: 9090
  metrics_path: /metrics

distributed:
  use_redis: false
  redis_host: localhost
  redis_port: 6379
  redis_db: 0